name: Bug report
description: Report incorrect rendering, parsing, or AsciiDoc output
title: "Bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal input and reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
