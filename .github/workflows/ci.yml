name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Lint, test, and build example
        run: bundle exec rake lint test assets:check licenses:check example:build
      - name: Build and install gem from local package
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          gem_version="$(ruby -Ilib -rmahjong_render/version -e 'print MahjongRender::VERSION')"
          mkdir -p tmp
          gem_path="tmp/mahjong-render-${gem_version}.gem"
          gem build mahjong-render.gemspec --output "$gem_path"
          gem build mahjong-render.gemspec --output "$RUNNER_TEMP/mahjong-render-${gem_version}.gem"
          cmp "$gem_path" "$RUNNER_TEMP/mahjong-render-${gem_version}.gem"
          ruby script/check_package.rb "$gem_path"
          gem install --install-dir tmp/gem-home --no-document "$gem_path"
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" ruby -rmahjong_render -e 'File.write("tmp/readme-hand.svg", MahjongRender.render("405m456p789s12344z"))'
          test -s tmp/readme-hand.svg
          printf '= Mahjong hand\n\nmahjong::405m456p789s12344z[]\n' > tmp/hand.adoc
          RUBYLIB="$PWD/tmp/gem-home/gems/mahjong-render-${gem_version}/lib:$(bundle show asciidoctor)/lib" ruby "$(bundle show asciidoctor)/bin/asciidoctor" -r mahjong_render/asciidoctor -o tmp/hand.html tmp/hand.adoc
          ruby -e 'abort unless File.read("tmp/hand.html").include?("<svg ")'
