name: Publish gem

on:
  workflow_dispatch:
    inputs:
      version:
        description: Gem version on main, for example 0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: rubygems-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Verify Ruby gem
        run: bundle exec rake lint test assets:check licenses:check example:build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: "3.4"
      - name: Validate release ref and gem version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Manual releases must run from main"; exit 1; }
            release_version="$REQUESTED_VERSION"
          else
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "Release tag must point to a commit on main"; exit 1; }
            release_version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid gem version"; exit 1; }
          gem_version="$(ruby -Ilib -rmahjong_render/version -e 'print MahjongRender::VERSION')"
          [[ "$release_version" == "$gem_version" ]] || { echo "Release ref and gem version differ"; exit 1; }
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
      - name: Build and check gem
        run: |
          mkdir -p pkg
          gem build mahjong-render.gemspec --output "pkg/mahjong-render-${RELEASE_VERSION}.gem"
          ruby script/check_package.rb "pkg/mahjong-render-${RELEASE_VERSION}.gem"
      - name: Check whether this version is already published
        id: availability
        run: |
          metadata_file="$RUNNER_TEMP/mahjong-render-version.json"
          status="$(curl --silent --show-error --output "$metadata_file" --write-out '%{http_code}' "https://rubygems.org/api/v2/rubygems/mahjong-render/versions/${RELEASE_VERSION}.json")"
          case "$status" in
            200)
              ruby -rjson -e 'data = JSON.parse(File.read(ARGV.fetch(0))); abort "published version belongs to another source" unless data.dig("metadata", "source_code_uri") == "https://github.com/kjun1/mahjong-render"' "$metadata_file"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Version ${RELEASE_VERSION} is already published"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "RubyGems version lookup failed: HTTP $status"
              exit 1
              ;;
          esac
      - name: Configure RubyGems Trusted Publishing
        if: steps.availability.outputs.publish == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish gem
        if: steps.availability.outputs.publish == 'true'
        run: gem push "pkg/mahjong-render-${RELEASE_VERSION}.gem"
